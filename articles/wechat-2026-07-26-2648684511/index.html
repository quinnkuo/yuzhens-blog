来源：真不错真棒 </a> </header> <div class="prose"> <p>凌晨 4 点就被台风的风雨声吵醒了，之后怎么也睡不着，只能听了两个小时的雨声，才迷糊糊又睡了过去。</p>
<p>台风天也没什么地方可去，于是决定带着孩子去看《汪汪队》超前点映。等雨势稍微小了一些，我们才出门。一路上看到不少树木被吹倒，共享单车也东倒西歪，街上的车辆和行人都比平时少了许多。</p>
<p>只有台风才能让这个城市慢下来。</p>
